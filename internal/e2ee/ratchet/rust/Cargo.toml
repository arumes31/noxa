[package]
name = "noxa-ratchet-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
vodozemac = { version = "=0.11.1", features = ["low-level-api"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.4.3"
base64 = "=0.23.1"
zeroize = "=1.9.1"
[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"
