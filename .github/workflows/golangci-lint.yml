name: golangci-lint

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0 # Updated Go export-data reader for the patched toolchain
          install-mode: binary
          working-directory: .

      - name: prepare embedded frontend for client lint
        run: |
          mkdir -p client/frontend/dist
          touch client/frontend/dist/.lint-placeholder

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('scripts/ci-apt-setup.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: install linux client dependencies
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-apt-setup.sh"
          if [ -d "$HOME/.cache/apt/archives" ]; then
            sudo cp -n "$HOME"/.cache/apt/archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          mkdir -p "$HOME/.cache/apt/archives"
          cp -n /var/cache/apt/archives/*.deb "$HOME/.cache/apt/archives/" 2>/dev/null || true

      - name: golangci-lint (client)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: binary
          working-directory: client
