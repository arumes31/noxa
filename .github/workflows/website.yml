name: Website

on:
  # Validate every PR so a required "Website validation" check never remains
  # pending merely because an unrelated PR did not match a path filter.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Website validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate static content and browser behavior
        run: npm test

      # Network availability is independent from the deterministic browser
      # suite. Confirm the download contract for the public website.
      - name: Verify the latest Windows release asset
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event.repository.default_branch == 'main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run check:release
        env:
          GITHUB_TOKEN: ${{ github.token }}
