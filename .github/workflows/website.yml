name: Website

on:
  # Validate every PR so a required "Website validation" check never remains
  # pending merely because an unrelated PR did not match a path filter.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Website validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify generated guides are up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- public/guides public/sitemap.xml)" ]; then
            git status --short -- public/guides public/sitemap.xml
            echo "Generated guides are out of date. Run npm run build and commit the result." >&2
            exit 1
          fi
      - name: Validate static content and browser behavior
        run: npm test

      # Network availability is independent from the deterministic browser
      # suite. Confirm the download contract for the public website.
      - name: Verify the latest Windows release asset
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event.repository.default_branch == 'main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run check:release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  image:
    name: Website Docker image
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish website image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: website
          file: website/Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}-website:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
      - name: Check static image responses
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name website --read-only --tmpfs /data:uid=10001,gid=10001 --tmpfs /config:uid=10001,gid=10001 --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 "ghcr.io/${{ github.repository }}-website:sha-${{ github.sha }}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            echo "Waiting for website (attempt $attempt/20)"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/guides/server-setup/ | grep -q 'Initialize the database'
          curl --fail --silent http://127.0.0.1:8080/robots.txt | grep -q 'sitemap.xml'
          curl --fail --silent http://127.0.0.1:8080/sitemap.xml | grep -q '/guides/server-setup/'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/package.json)" = 404
      - name: Export published image for deployment
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${{ github.repository }}-website:sha-${{ github.sha }}"
          docker pull "$image"
          docker save "$image" | gzip > "$RUNNER_TEMP/noxa-website-image.tar.gz"
          sha256sum "$RUNNER_TEMP/noxa-website-image.tar.gz" > "$RUNNER_TEMP/noxa-website-image.sha256"
      - name: Retain deployment image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noxa-website-image
          path: |
            ${{ runner.temp }}/noxa-website-image.tar.gz
            ${{ runner.temp }}/noxa-website-image.sha256
          retention-days: 7
