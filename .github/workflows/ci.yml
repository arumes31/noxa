name: CI

on:
  push:
  pull_request:
    # Label changes must rerun the visible, reviewable one-time breaking skip.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  proto-contract:
    name: Proto contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Breaking-change checks compare the exact PR base SHA, so shallow
      # history is not sufficient.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned official Buf action, used only to install the exact CLI. The
      # individual checks below remain visible in the CI log.
      - name: Set up Buf 1.72.0
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          setup_only: true
          version: 1.72.0

      - name: verify proto-contract policy scope
        run: bash scripts/verify-proto-contract.sh

      - name: lint protobuf contracts
        run: buf lint

      - name: regenerate committed Go protobuf stubs
        run: |
          buf generate
          if [[ -n "$(git status --porcelain --untracked-files=all -- v1)" ]]; then
            echo "generated protobuf stubs under v1 are not clean"
            git status --porcelain --untracked-files=all -- v1
            exit 1
          fi

      - name: test generated protobuf contracts
        run: >-
          go test ./internal/grpcserver -run
          '^(TestGeneratedServiceContracts|TestGeneratedAuthenticationCompatibilityContracts|TestUserBannedEventChannelFieldContract|TestChannelDeletedEventIncludesDeleteReason)$'

      - name: check protobuf breaking changes
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking')
        run: >-
          buf breaking --against
          "${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }}"

      - name: record approved breaking-check skip
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'buf skip breaking')
        run: |
          echo "::warning::Buf breaking check skipped because this PR has the explicit 'buf skip breaking' label."
          echo "Remove the label to rerun breaking-change detection against ${{ github.event.pull_request.base.sha }}."

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e

  client-windows:
    name: Client Windows validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json

      - name: build frontend assets
        working-directory: client/frontend
        run: |
          npm ci
          npm run build

      - name: test client
        working-directory: client
        run: go test -tags=integration -count=1 ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # 16.14-alpine3.24
        env:
          POSTGRES_USER: noxa
          POSTGRES_PASSWORD: noxa
          POSTGRES_DB: noxa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noxa -d noxa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4.10-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json

      - name: install linux client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev postgresql-client xvfb

      - name: build frontend assets
        working-directory: client/frontend
        run: |
          npm ci
          npm run build

      - name: verify version metadata
        run: go run ./cmd/version -check

      - name: verify module checksums
        run: |
          go mod verify
          # Treat the locally replaced noxa module as workspace source.
          # Otherwise Go tries to verify a nonexistent published noxa module zip.
          export GOWORK="$RUNNER_TEMP/verify.work"
          go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/client"
          (cd client && go mod verify)

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt issues in:"; echo "$fmt"; exit 1
          fi

      - name: vet
        run: |
          go vet ./...
          (cd client && go vet ./...)

      - name: build
        run: |
          go build ./...
          (cd client && go build ./...)

      - name: benchmark smoke
        run: go test -count=1 -run '^$' -bench=. -benchtime=1x ./internal/netproto ./internal/chatcrypto ./internal/authorization ./internal/filetransfer

      - name: test and enforce coverage
        run: |
          root_coverage="$RUNNER_TEMP/root-unit.out"
          go test -race -count=1 -covermode=atomic -coverprofile="$root_coverage" ./internal/...
          go test -race -count=1 ./cmd/... ./v1
          root_pct="$(go tool cover -func="$root_coverage" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v got="$root_pct" 'BEGIN {
            minimum = 70
            if (got + 0 < minimum) {
              printf "root internal coverage %.1f%% is below %.1f%%\n", got, minimum
              exit 1
            }
          }'

          client_coverage="$RUNNER_TEMP/client-unit.out"
          (cd client && xvfb-run -a go test -race -count=1 -covermode=atomic -coverprofile="$client_coverage" ./...)
          client_pct="$(cd client && go tool cover -func="$client_coverage" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v got="$client_pct" 'BEGIN {
            minimum = 50
            if (got + 0 < minimum) {
              printf "client coverage %.1f%% is below %.1f%%\n", got, minimum
              exit 1
            }
          }'

          printf "root internal coverage: %s%%\nclient coverage: %s%%\n" "$root_pct" "$client_pct"
        env:
          NOXA_TEST_DATABASE_URL: postgres://noxa:noxa@localhost:5432/noxa?sslmode=disable
          NOXA_REDIS_ADDR: localhost:6379

      - name: upload coverage profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            ${{ runner.temp }}/root-unit.out
            ${{ runner.temp }}/client-unit.out

      - name: verify database backup and restore
        shell: bash
        env:
          PGHOST: localhost
          PGUSER: noxa
          PGPASSWORD: noxa
          NOXA_DEV_MODE: "true"
        run: |
          set -euo pipefail
          source_db="noxa_backup_source"
          restore_db="noxa_backup_restore"
          backup="$RUNNER_TEMP/noxa-backup.pgdump"
          cleanup() {
            dropdb --if-exists --force "$source_db"
            dropdb --if-exists --force "$restore_db"
          }
          trap cleanup EXIT
          cleanup
          createdb "$source_db"
          NOXA_DATABASE_URL="postgres://noxa:noxa@localhost:5432/$source_db?sslmode=disable" \
            go run ./cmd/migrate -timeout 2m
          # Exercise relational user/channel/role data, not only an
          # empty migration ledger. These identities are disposable fixtures.
          psql --dbname="$source_db" --set=ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO users (unique_id, nickname) VALUES ('backup-fixture', 'Restore fixture');
          INSERT INTO channels (name, channel_type, created_by)
            SELECT 'Backup channel', 2, id FROM users WHERE unique_id = 'backup-fixture';
          INSERT INTO auth_roles (name, position) VALUES ('Backup role', 1);
          INSERT INTO auth_role_grants (role_id, capability)
            SELECT id, 'speak' FROM auth_roles WHERE name = 'Backup role';
          INSERT INTO auth_member_roles (user_id, role_id)
            SELECT u.id, r.id FROM users u CROSS JOIN auth_roles r
            WHERE u.unique_id = 'backup-fixture' AND r.name = 'Backup role';
          COMMIT;
          SQL
          fixture_query="SELECT u.unique_id, u.nickname, c.name, r.name,
            r.position, g.capability
            FROM users u JOIN channels c ON c.created_by = u.id
            JOIN auth_member_roles m ON m.user_id = u.id
            JOIN auth_roles r ON r.id = m.role_id
            JOIN auth_role_grants g ON g.role_id = r.id
            WHERE u.unique_id = 'backup-fixture' ORDER BY c.id, r.id, g.capability"
          source_fixture="$(psql --dbname="$source_db" --tuples-only --no-align --command="$fixture_query")"
          test -n "$source_fixture"
          pg_dump --format=custom --no-owner --file="$backup" "$source_db"
          test -s "$backup"
          createdb "$restore_db"
          pg_restore --exit-on-error --no-owner --dbname="$restore_db" "$backup"
          NOXA_DATABASE_URL="postgres://noxa:noxa@localhost:5432/$restore_db?sslmode=disable" \
            go run ./cmd/migrate -timeout 2m
          source_ledger="$(psql --dbname="$source_db" --tuples-only --no-align \
            --command="SELECT filename || ':' || checksum FROM public.schema_migrations ORDER BY filename")"
          restore_ledger="$(psql --dbname="$restore_db" --tuples-only --no-align \
            --command="SELECT filename || ':' || checksum FROM public.schema_migrations ORDER BY filename")"
          test -n "$source_ledger"
          test "$source_ledger" = "$restore_ledger"
          restore_fixture="$(psql --dbname="$restore_db" --tuples-only --no-align --command="$fixture_query")"
          test "$source_fixture" = "$restore_fixture"

  security-gate:
    name: Security analysis
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  docker:
    needs: [proto-contract, test, frontend-e2e, security-gate]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: compute version metadata
        shell: bash
        run: go run ./cmd/version -check -format github >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/') && env.NOXA_PRERELEASE == 'false') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOXA_VERSION=${{ env.NOXA_VERSION }}
            NOXA_COMMIT=${{ env.NOXA_COMMIT }}
            NOXA_DIRTY=${{ env.NOXA_DIRTY }}
            NOXA_BUILD_DATE=${{ env.NOXA_BUILD_DATE }}
            NOXA_UPDATE_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release-lint:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/golangci-lint.yml

  release-build:
    needs: [proto-contract, test, frontend-e2e, client-windows, security-gate, release-lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release-metadata.outputs.tag }}
      prerelease: ${{ steps.release-metadata.outputs.prerelease }}
    env:
      NOXA_UPDATE_PUBLIC_KEYS: ${{ vars.NOXA_UPDATE_PUBLIC_KEYS || vars.VOICX_UPDATE_PUBLIC_KEYS }}
      NOXA_UPDATE_REPO: ${{ github.repository }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: prepare release version metadata
        id: release-metadata
        shell: bash
        run: bash scripts/prepare-release.sh

      - name: validate update public-key configuration
        shell: bash
        run: |
          test -n "$NOXA_UPDATE_PUBLIC_KEYS" || {
            echo "repository variable NOXA_UPDATE_PUBLIC_KEYS is required" >&2
            exit 1
          }

      - name: install wails CLI
        shell: bash
        working-directory: client
        run: |
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wails_version"

      - name: build client (windows/amd64)
        shell: bash
        working-directory: client
        run: |
          # Package resources use the same numeric patch as the signed release.
          node --input-type=module -e 'import fs from "node:fs"; const path = "wails.json"; const config = JSON.parse(fs.readFileSync(path, "utf8")); config.info.productVersion = process.env.NOXA_VERSION.split(/[+-]/)[0]; fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");'
          wails build -trimpath -ldflags "-s -w $NOXA_LDFLAGS \
            -X=noxa/internal/version.UpdateRepo=$NOXA_UPDATE_REPO \
            -X=noxa/internal/version.UpdatePublicKeys=$NOXA_UPDATE_PUBLIC_KEYS"

      - name: build server (linux/amd64)
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath -ldflags "-s -w $NOXA_LDFLAGS \
              -X=noxa/internal/version.UpdateRepo=$NOXA_UPDATE_REPO" \
            -o noxa-server-linux-amd64 ./cmd/server

      - name: stage release binaries
        shell: bash
        run: |
          cp client/build/bin/noxa.exe noxa-client-windows-amd64.exe

      - name: attest release binary build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            noxa-client-windows-amd64.exe
            noxa-server-linux-amd64

      - name: upload release binaries for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            noxa-client-windows-amd64.exe
            noxa-server-linux-amd64
          if-no-files-found: error
          retention-days: 1

  release-sign:
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOXA_RELEASE_TAG: ${{ needs.release-build.outputs.tag }}
      NOXA_UPDATE_PUBLIC_KEYS: ${{ vars.NOXA_UPDATE_PUBLIC_KEYS || vars.VOICX_UPDATE_PUBLIC_KEYS }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release

      - name: create release manifest
        shell: bash
        run: |
          test -n "$NOXA_UPDATE_PUBLIC_KEYS" || {
            echo "repository variable NOXA_UPDATE_PUBLIC_KEYS is required" >&2
            exit 1
          }
          printf '# noxa-version: %s\n' "$NOXA_RELEASE_TAG" > release/checksums.txt
          sha256sum release/noxa-client-windows-amd64.exe release/noxa-server-linux-amd64 \
            | sed 's#  release/#  #' >> release/checksums.txt

      - name: build release signer
        shell: bash
        run: go build -trimpath -o "$RUNNER_TEMP/signrelease" ./cmd/signrelease

      - name: sign release manifest
        shell: bash
        env:
          NOXA_UPDATE_SIGNING_KEY: ${{ secrets.NOXA_UPDATE_SIGNING_KEY || secrets.VOICX_UPDATE_SIGNING_KEY }}
        run: '"$RUNNER_TEMP/signrelease" -in release/checksums.txt -out release/checksums.txt.sig -version "$NOXA_RELEASE_TAG"'

      - name: verify signed release assets
        shell: bash
        run: |
          go run ./cmd/signrelease -verify -in release/checksums.txt \
            -out release/checksums.txt.sig -version "$NOXA_RELEASE_TAG"
          (
            cd release
            test "$(head -n 1 checksums.txt)" = "# noxa-version: $NOXA_RELEASE_TAG"
            test "$(tail -n +2 checksums.txt | wc -l)" -eq 2
            test "$(tail -n +2 checksums.txt | awk '{print $2}')" = "$(printf '%s\n%s' noxa-client-windows-amd64.exe noxa-server-linux-amd64)"
            tail -n +2 checksums.txt | sha256sum --check --strict
          )

      - name: upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          retention-days: 1

  release-publish:
    needs: [release-build, release-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOXA_RELEASE_TAG: ${{ needs.release-build.outputs.tag }}
      NOXA_UPDATE_PUBLIC_KEYS: ${{ vars.NOXA_UPDATE_PUBLIC_KEYS || vars.VOICX_UPDATE_PUBLIC_KEYS }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: verify signed release manifest
        shell: bash
        run: |
          go run ./cmd/signrelease -verify -in release/checksums.txt \
            -out release/checksums.txt.sig -version "$NOXA_RELEASE_TAG"
          (
            cd release
            test "$(head -n 1 checksums.txt)" = "# noxa-version: $NOXA_RELEASE_TAG"
            test "$(tail -n +2 checksums.txt | wc -l)" -eq 2
            test "$(tail -n +2 checksums.txt | awk '{print $2}')" = "$(printf '%s\n%s' noxa-client-windows-amd64.exe noxa-server-linux-amd64)"
            tail -n +2 checksums.txt | sha256sum --check --strict
          )

      - name: upload verified release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release-build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.release-build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.release-build.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: |
            release/noxa-client-windows-amd64.exe
            release/noxa-server-linux-amd64
            release/checksums.txt
            release/checksums.txt.sig
