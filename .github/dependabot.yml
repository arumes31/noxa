version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Upstream confirms 1.84.0 is patched, but GO-2026-6443 still flags it.
      # Retain patched 1.83.2 until the database or a later stable release fixes
      # the mismatch; never suppress the CI vulnerability check.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.0"]

  - package-ecosystem: "gomod"
    directory: "/client"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/client/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/client/third_party/go-webview2"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # pg_dump/pg_restore must match the supported PostgreSQL 16 server.
      # Upgrade these together with a rehearsed database/restore migration.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
