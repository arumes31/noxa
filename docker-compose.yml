# docker-compose.yml — noxa full stack (Go server + PostgreSQL + Redis)
#
# Usage:
#   make compose-up   # build & start the whole stack detached
#   make compose-down # stop & remove containers/networks
#
# Services resolve each other by service name on the `noxa-net` bridge network
# (e.g. the Go server connects to `postgres:5432` and `redis:6379`).
#
# The noxa service is configured purely through NOXA_* environment variables
# below (no config file is mounted). Credentials/defaults can be overridden via
# a .env file (see .env.example).

services:
  # ---------------------------------------------------------------------------
  # noxa — the Go voice/video server
  # ---------------------------------------------------------------------------
  noxa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Make/CI inject Git metadata. Empty values make a direct Compose build
        # derive a deterministic version from the copied source tree.
        NOXA_VERSION: ${NOXA_VERSION:-}
        NOXA_COMMIT: ${NOXA_COMMIT:-}
        NOXA_DIRTY: ${NOXA_DIRTY:-false}
        NOXA_BUILD_DATE: ${NOXA_BUILD_DATE:-}
        NOXA_UPDATE_REPO: ${NOXA_UPDATE_REPO:-arumes31/noxa}
    image: ${NOXA_IMAGE:-noxa:dev}
    container_name: noxa
    # --- GPU access for server-side hardware transcoding (optional) --------
    # Only needed when recording.video_args uses a hardware encoder. Uncomment
    # ONE of the variants below.
    #
    # Intel/AMD (VAAPI/QuickSync via DRI):
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # NVIDIA (NVENC; requires the NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # --- Container hardening -------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - noxa-net
    ports:
      # TeamSpeak-style voice transport (UDP)
      - "12334:12334/udp"
      # TLS control channel
      - "12333:12333"
      # Raw ServerQuery is loopback-only inside the container by default.
      # Prefer SSH for remote administration. If raw remote access is
      # intentional, publish 12335 and set both NOXA_QUERY_ADDR=:12335 and
      # NOXA_QUERY_ALLOW_REMOTE=true.
      # - "12335:12335"
      # Preferred remote administration: enable Query SSH and publish 12339.
      # - "12339:12339"
      # File transfer
      - "12336:12336"
      # Health/readiness/metrics HTTP endpoint
      - "12337:12337"
    volumes:
      # Writable data (uploaded files, avatars, icons, recordings) so the
      # root filesystem can stay read-only.
      - noxadata:/data
      - type: bind
        source: ${NOXA_COMPOSE_DATABASE_URL_FILE:-./docker/secrets/.empty}
        target: /run/secrets/noxa_database_url
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${POSTGRES_PASSWORD_FILE:-./docker/secrets/.empty}
        target: /run/secrets/postgres_password
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${REDIS_PASSWORD_FILE:-./docker/secrets/.empty}
        target: /run/secrets/redis_password
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${TURN_SECRET_FILE:-./docker/secrets/.empty}
        target: /run/secrets/turn_secret
        read_only: true
        bind: { create_host_path: false }
    environment:
      # --- Logging ---
      NOXA_LOG_LEVEL: ${NOXA_LOG_LEVEL:-info}
      # Required explicit choice: the sample .env selects local development.
      # Production validation adds database credential and TLS requirements.
      NOXA_DEV_MODE: ${NOXA_DEV_MODE:?set NOXA_DEV_MODE to true or false}

      # --- Database (points at the postgres service) ---
      # The entrypoint builds a percent-encoded URL from these discrete values
      # unless a complete URL or URL_FILE is supplied for an external database.
      NOXA_DATABASE_URL: ${NOXA_COMPOSE_DATABASE_URL:-}
      NOXA_DATABASE_URL_FILE: ${NOXA_COMPOSE_DATABASE_URL_FILE:+/run/secrets/noxa_database_url}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-noxa}
      POSTGRES_DB: ${POSTGRES_DB:-noxa}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:+/run/secrets/postgres_password}
      NOXA_PII_KEY_FILE: "/data/keys/pii.key"

      # --- Redis (points at the redis service) ---
      NOXA_REDIS_ADDR: "redis:6379"
      NOXA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NOXA_REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:+/run/secrets/redis_password}

      # --- Listen addresses (kept in sync with the published ports) ---
      NOXA_TCP_ADDR: ":12333"
      NOXA_UDP_ADDR: ":12334"
      # gRPC carries Basic credentials over plaintext and is loopback-only.
      NOXA_GRPC_ADDR: "127.0.0.1:12338"
      NOXA_HEALTH_ADDR: ":12337"
      NOXA_METRICS_ALLOW_REMOTE: ${NOXA_METRICS_ALLOW_REMOTE:-false}
      NOXA_PPROF_ENABLED: ${NOXA_PPROF_ENABLED:-false}
      NOXA_SHUTDOWN_TIMEOUT: ${NOXA_SHUTDOWN_TIMEOUT:-30s}
      NOXA_QUERY_ADDR: ${NOXA_QUERY_ADDR:-127.0.0.1:12335}
      NOXA_QUERY_ALLOW_REMOTE: ${NOXA_QUERY_ALLOW_REMOTE:-false}
      NOXA_QUERY_SSH_ENABLED: ${NOXA_QUERY_SSH_ENABLED:-false}
      NOXA_QUERY_SSH_ADDR: ":12339"
      NOXA_QUERY_SSH_HOST_KEY: "/data/keys/query_ssh_host.key"
      NOXA_FILE_ADDR: ":12336"

      # --- Writable data on the named volume (read_only root fs) ---
      NOXA_FILE_ROOT: "/data/files"
      NOXA_RECORDING_DIR: "/data/recordings"
      # TLS cert persists on the volume (stable TOFU fingerprint across restarts)
      NOXA_TLS_DIR: "/data/tls"

      # --- TURN (optional; must match the coturn service, profile "turn") ---
      NOXA_TURN_SECRET: ${TURN_SECRET:-}
      NOXA_TURN_SECRET_FILE: ${TURN_SECRET_FILE:+/run/secrets/turn_secret}
      NOXA_TURN_REALM: ${TURN_REALM:-noxa}
      # Comma-separated client URIs, e.g. turn:localhost:12340?transport=udp
      NOXA_TURN_URIS: ${NOXA_TURN_URIS:-}
  # ---------------------------------------------------------------------------
  # postgres — primary relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # 16.14-alpine3.24
    container_name: noxa-postgres
    restart: unless-stopped
    networks:
      - noxa-net
    # Exposed only internally; the noxa service connects via `postgres:5432`.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noxa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:+/run/secrets/postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-noxa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ${POSTGRES_PASSWORD_FILE:-./docker/secrets/.empty}
        target: /run/secrets/postgres_password
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nightly compressed dumps. Backups use a volume separate from pgdata and
  # are retained for seven days; set BACKUP_REMOTE for optional object upload.
  postgres-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: ${NOXA_BACKUP_IMAGE:-noxa-backup:dev}
    profiles: ["backup"]
    restart: ${BACKUP_RESTART_POLICY:-unless-stopped}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noxa-net
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-noxa}
      PGDATABASE: ${POSTGRES_DB:-noxa}
      PGSSLMODE: ${POSTGRES_SSLMODE:-disable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:+/run/secrets/postgres_password}
      # A complete external application URL selects this fail-closed path:
      # every BACKUP_PG* setting and backup password source becomes required.
      BACKUP_EXTERNAL_DATABASE: "${NOXA_COMPOSE_DATABASE_URL:+1}${NOXA_COMPOSE_DATABASE_URL_FILE:+1}"
      BACKUP_PGHOST: ${BACKUP_PGHOST:-}
      BACKUP_PGPORT: ${BACKUP_PGPORT:-}
      BACKUP_PGUSER: ${BACKUP_PGUSER:-}
      BACKUP_PGDATABASE: ${BACKUP_PGDATABASE:-}
      BACKUP_PGSSLMODE: ${BACKUP_PGSSLMODE:-}
      BACKUP_POSTGRES_PASSWORD: ${BACKUP_POSTGRES_PASSWORD:-}
      BACKUP_POSTGRES_PASSWORD_FILE: ${BACKUP_POSTGRES_PASSWORD_FILE:+/run/secrets/backup_postgres_password}
      BACKUP_PGSSLROOTCERT: ${BACKUP_PGSSLROOTCERT_FILE:+/run/secrets/backup_pgsslrootcert}
      BACKUP_PGSSLCERT: ${BACKUP_PGSSLCERT_FILE:+/run/secrets/backup_pgsslcert}
      BACKUP_PGSSLKEY: ${BACKUP_PGSSLKEY_FILE:+/run/secrets/backup_pgsslkey}
      BACKUP_DIR: /backups/postgres
      BACKUP_RETENTION_DAYS: 7
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG: ${RCLONE_CONFIG_FILE:+/run/secrets/rclone.conf}
    volumes:
      - pgbackups:/backups
      - type: bind
        source: ${POSTGRES_PASSWORD_FILE:-./docker/secrets/.empty}
        target: /run/secrets/postgres_password
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${BACKUP_POSTGRES_PASSWORD_FILE:-./docker/secrets/.empty}
        target: /run/secrets/backup_postgres_password
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${BACKUP_PGSSLROOTCERT_FILE:-./docker/secrets/.empty}
        target: /run/secrets/backup_pgsslrootcert
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${BACKUP_PGSSLCERT_FILE:-./docker/secrets/.empty}
        target: /run/secrets/backup_pgsslcert
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${BACKUP_PGSSLKEY_FILE:-./docker/secrets/.empty}
        target: /run/secrets/backup_pgsslkey
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${RCLONE_CONFIG_FILE:-./docker/secrets/.empty}
        target: /run/secrets/rclone.conf
        read_only: true
        bind: { create_host_path: false }

  # ---------------------------------------------------------------------------
  # redis — cache / pub-sub / session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4.10-alpine
    container_name: noxa-redis
    restart: unless-stopped
    networks:
      - noxa-net
    # Exposed only internally; the noxa service connects via `redis:6379`.
    expose:
      - "6379"
    volumes:
      - redisdata:/data
      - ./scripts/secret-env.sh:/usr/local/lib/noxa/secret-env.sh:ro
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/noxa-redis-entrypoint.sh:ro
      - type: bind
        source: ${REDIS_PASSWORD_FILE:-./docker/secrets/.empty}
        target: /run/secrets/redis_password
        read_only: true
        bind: { create_host_path: false }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:+/run/secrets/redis_password}
    entrypoint: ["/bin/sh", "/usr/local/bin/noxa-redis-entrypoint.sh"]
    healthcheck:
      test: [ "CMD-SHELL", ". /usr/local/lib/noxa/secret-env.sh && secret_env_load REDIS_PASSWORD optional && REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # coturn — TURN server for NAT traversal (445/446; OPTIONAL profile)
  #
  # Only needed for clients behind restrictive NATs (symmetric NAT, corporate
  # firewalls blocking UDP). LAN / direct-WAN deployments can skip it.
  #
  # Start with:  TURN_SECRET=<random> TURN_EXTERNAL_IP=<public ip> \
  #                docker compose --profile turn up -d
  #
  # Uses coturn's REST API auth: noxa mints time-limited credentials from the
  # shared static auth secret (internal/turn) and delivers them to clients in
  # the auth response. TURN_SECRET must match NOXA_TURN_SECRET on the noxa
  # service; set BOTH in .env or neither side works (445). Also set on noxa
  # (comma-separated):
  #   NOXA_TURN_URIS=turn:<host>:12340?transport=udp,turn:<host>:12340?transport=tcp
  #
  # TURN_EXTERNAL_IP is REQUIRED for any client outside this host (445): on the
  # bridge network coturn discovers only its 172.x container address and would
  # advertise relay candidates no external client can reach, so relaying fails
  # even though the ports below are published. --external-ip keeps the binding
  # on 172.x but rewrites the ADVERTISED address to the public one. Leaving it
  # unset drops the flag, which is only correct for host-local testing.
  # (Alternative to --external-ip: network_mode: host, which also drops the
  # 101-port relay publish — but it cannot coexist with the noxa-net bridge.)
  # ---------------------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.17.0-r0@sha256:7df59bcd84800c3978da2dd0d7fb17a8179e77a8bf667f678813120a9f18b094
    container_name: noxa-coturn
    profiles: [ "turn" ]
    restart: unless-stopped
    networks:
      - noxa-net
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_SECRET_FILE: ${TURN_SECRET_FILE:+/run/secrets/turn_secret}
    volumes:
      - ./scripts/coturn-entrypoint.sh:/usr/local/bin/noxa-coturn-entrypoint.sh:ro
      - ./scripts/secret-env.sh:/usr/local/lib/noxa/secret-env.sh:ro
      - type: bind
        source: ${TURN_SECRET_FILE:-./docker/secrets/.empty}
        target: /run/secrets/turn_secret
        read_only: true
        bind: { create_host_path: false }
    entrypoint: [ "/bin/sh", "/usr/local/bin/noxa-coturn-entrypoint.sh" ]
    ports:
      - "12340:12340"
      - "12340:12340/udp"
      # Relay ports (must be reachable by clients; widen in production).
      - "12342-12366:12342-12366/udp"
      # TLS/DTLS listener; only publish it together with the cert block below.
      # - "12341:12341"
      # - "12341:12341/udp"
    # volumes:
    #   # TLS material for turns:/DTLS (see the cert flags below).
    #   - ./data/turn-certs:/etc/coturn/certs:ro
    command:
      - "--listening-port=12340"
      # turns: needs a real certificate for the TURN hostname, which this repo
      # cannot ship. TLS/DTLS is therefore OFF rather than advertised-but-broken
      # (445). To enable: put fullchain.pem/privkey.pem in ./data/turn-certs,
      # uncomment the volume and the 12341 ports above, drop the two --no-*
      # lines, and add
      #   --tls-listening-port=12341
      #   --cert=/etc/coturn/certs/fullchain.pem
      #   --pkey=/etc/coturn/certs/privkey.pem
      # then append turns:<host>:12341?transport=tcp to NOXA_TURN_URIS.
      - "--no-tls"
      - "--no-dtls"
      - "--realm=${TURN_REALM:-noxa}"
      - "--use-auth-secret"
      # Empty when TURN_EXTERNAL_IP is unset; coturn ignores the empty argument.
      - "${TURN_EXTERNAL_IP:+--external-ip=$TURN_EXTERNAL_IP}"
      - "--min-port=12342"
      - "--max-port=12366"
      - "--no-multicast-peers"
      - "--no-cli"
      # --log=stdout is ambiguous in coturn 4.16 and aborts startup with exit
      # 255 before any listener opens (445).
      - "--log-file=stdout"

  # Toxiproxy is used only by scripts/chaos-webrtc.sh. WebRTC is forced
  # through the TURN/TCP proxy because Toxiproxy intentionally supports TCP,
  # not UDP; this still exercises the SFU media path under latency, jitter and
  # periodic transport outages rather than merely perturbing signaling.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    container_name: noxa-toxiproxy
    profiles: [ "chaos-network" ]
    restart: "no"
    networks:
      - noxa-net
    ports:
      - "12365:8474"
      - "12366:12366"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  noxa-net:
    driver: bridge
    name: noxa-net

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    name: ${NOXA_PGDATA_VOLUME:-noxa-pgdata}
  pgbackups:
    name: ${NOXA_PGBACKUPS_VOLUME:-noxa-pgbackups}
  redisdata:
    name: ${NOXA_REDISDATA_VOLUME:-noxa-redisdata}
  noxadata:
    name: ${NOXA_DATA_VOLUME:-noxa-data}
