<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noXa</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/branding/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/workspace.css" />
</head>
<body class="details-collapsed">
    <!-- Login overlay -->
    <div id="login-overlay">
        <form class="login-card" aria-labelledby="login-title">
            <h1 id="login-title" class="wordmark"><img class="login-logo" src="/branding/logo.png" width="56" height="56" alt="" />noXa</h1>
            <label for="login-addr">SERVER <input id="login-addr" value="127.0.0.1:12333" autocomplete="url" spellcheck="false" /></label>
            <label for="login-nick">NICKNAME <input id="login-nick" placeholder="nickname" autocomplete="nickname" /></label>
            <label for="login-accountpw">Account password (optional) <input id="login-accountpw" type="password" placeholder="for a registered account" autocomplete="current-password" /></label>
            <label for="login-serverpw">Server password (optional) <input id="login-serverpw" type="password" placeholder="if required" autocomplete="off" /></label>
            <button id="login-connect" type="submit">CONNECT</button>
            <div id="login-error" role="alert" aria-live="assertive"></div>
            <div class="pane-head">RECENT SERVERS</div>
            <div id="login-recents" role="region" aria-label="Recent servers"></div>
            <div class="identity-footnote">
                Identity auto-generated — stored locally
                <span class="mono" id="login-identity"></span>
                <span class="mono version-foot" id="login-version"></span>
            </div>
        </form>
    </div>

    <div id="toasts" role="region" aria-label="Notifications"></div>

    <!-- Main three-pane layout -->
    <div id="app" class="hidden">
        <a class="skip-link" href="#chat-text">Skip to message composer</a>
        <nav id="menubar" aria-label="Application menu"></nav>
        <nav id="server-tabs" aria-label="Server connections"></nav>
        <div id="app-body">
        <aside id="sidebar" aria-labelledby="channels-heading">
            <div class="brand">
                <img id="server-icon" class="hidden" alt="" title="server icon" />
                <span class="server-identity"><button id="server-name" type="button" title="Server information" aria-haspopup="dialog">noXa</button><span id="server-summary">Not connected</span></span>
                <button id="alpha-badge" type="button" title="Alpha software — click for details" aria-label="About alpha software">Alpha</button>
                <span id="conn-lock" class="hidden" title="control channel TLS + chat payload encryption on">🔒</span>
                <button id="notif-bell" class="icon-btn" title="Notifications" aria-label="Notifications, 0 unread">🔔<span id="notif-badge" class="hidden"></span></button>
            </div>
            <div class="pane-head sidebar-head"><h2 id="channels-heading">Channels</h2><button id="channel-create-btn" class="icon-btn pane-head-btn" title="Create channel" aria-label="Create channel">+</button></div>
            <div id="tree-tools">
                <label class="sr-only" for="tree-filter">Filter channels, private groups and users</label>
                <input id="tree-filter" placeholder="Find channels, groups or people…" autocomplete="off" />
                <button id="tree-collapse" class="icon-btn" title="Collapse all" aria-label="Collapse all channels">▾</button>
                <button id="tree-expand" class="icon-btn" title="Expand all" aria-label="Expand all channels">▸</button>
            </div>
            <div id="sidebar-scroll"><div id="channel-tree"></div></div>
        </aside>

        <main id="center" tabindex="-1" aria-label="Voice and chat workspace">
            <div id="chat-head">
                <button id="workspace-sidebar-toggle" class="icon-btn" aria-label="Show channels" aria-expanded="false" aria-controls="sidebar"></button>
                <span class="channel-heading">
                    <span id="chat-head-title" role="heading" aria-level="2">Chat</span>
                    <span id="chat-topic" class="hidden" title=""></span>
                    <span id="chat-slowmode" class="hidden" title=""></span>
                </span>
                <span id="chat-head-actions">
                    <span id="channel-member-count" aria-label="Voice participant count">0</span>
                    <button id="details-toggle" class="icon-btn" title="Member details" aria-label="Open details" aria-expanded="false" aria-controls="details"></button>
                    <button id="chat-search-btn" class="icon-btn" title="Search chat (Ctrl+F)" aria-label="Search chat"></button>
                    <details class="channel-actions">
                        <summary aria-label="More channel actions" title="More channel actions">•••</summary>
                        <div class="channel-actions-menu">
                            <button id="chat-pins-btn" class="icon-btn" title="Pinned messages" aria-label="Pinned messages"></button>
                            <button id="chat-info-btn" class="icon-btn hidden" title="Channel description" aria-label="Channel description"></button>
                            <button id="chat-e2ee-btn" class="icon-btn" title="Encryption diagnostics" aria-label="Encryption diagnostics"></button>
                            <button id="chat-export-btn" class="icon-btn" title="Export the full stored history" aria-label="Export chat history"></button>
                        </div>
                    </details>
                </span>
            </div>
            <div id="center-tabs">
                <div id="workspace-tablist" role="tablist" aria-label="Workspace views">
                    <button id="tab-chat" class="active" role="tab" aria-selected="true" aria-controls="chat-pane" tabindex="0">Chat</button>
                    <button id="tab-files" role="tab" aria-selected="false" aria-controls="files-pane" tabindex="-1">Files</button>
                </div>
                <button id="tab-transfers" class="icon-btn" title="Transfers" aria-label="Open transfers" aria-haspopup="dialog">⇅</button>
            </div>
            <section id="voice-participants" role="region" aria-label="Voice participants"></section>
            <section id="chat-pane" role="tabpanel" aria-labelledby="tab-chat">
            <div id="banner-box"></div>
            <div id="talk-banner" class="hidden" role="status" aria-live="assertive">● TALKING</div>
            <div id="video-grid" class="hidden"></div>
            <div id="chat-search-row" class="hidden">
                <label class="sr-only" for="chat-search">Filter loaded messages</label>
                <input id="chat-search" placeholder="filter loaded messages… (Esc closes)" autocomplete="off" />
                <span id="chat-search-count" role="status" aria-live="polite" class="hidden"></span>
                <button id="chat-search-server" title="Decrypt and scan the whole scope history in this client">search all history</button>
                <button id="chat-search-close" class="icon-btn" title="Close search" aria-label="Close chat search">✕</button>
            </div>
            <div id="pm-tabs" class="hidden"></div>
            <div id="chat-wrap">
                <div id="chat-log" aria-labelledby="chat-head-title"></div>
                <button id="chat-newpill" class="hidden" aria-label="Jump to new messages"></button>
            </div>
            <div id="chat-typing" class="hidden" role="status" aria-live="polite"></div>
            <div id="reply-bar" class="hidden"></div>
            <div id="file-preview-row" class="hidden"></div>
            <div id="chat-send-error" class="hidden" role="status"><span></span><button type="button" id="chat-retry"></button></div>
            <div id="chat-input-row">
                <select id="chat-scope" aria-label="Message scope">
                    <option value="channel">This channel</option>
                    <option value="global">Entire server</option>
                    <option value="direct">Direct message</option>
                </select>
                <div id="chat-target-picker" class="hidden">
                    <input id="chat-target" placeholder="find connected member or enter UID" role="combobox" aria-label="Direct message recipient" aria-autocomplete="list" aria-expanded="false" aria-controls="chat-target-options" autocomplete="off" />
                    <button id="chat-target-toggle" type="button" aria-label="Show connected members" title="Show connected members">⌄</button>
                    <div id="chat-target-options" class="hidden" role="listbox"></div>
                </div>
                <input id="chat-text" placeholder="message…" aria-label="Message" autocomplete="off" />
                <input id="chat-file" type="file" multiple class="hidden" aria-label="Choose attachments" />
                <button id="chat-attach" class="icon-btn" title="Attach files (or paste / drop them here)" aria-label="Attach files">📎</button>
                <button id="chat-emoji" class="icon-btn" title="Emoji picker" aria-label="Open emoji picker">😊</button>
                <button id="chat-send">SEND</button>
            </div>
            </section>
            <section id="files-pane" role="tabpanel" aria-labelledby="tab-files" hidden></section>
            <div id="chat-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
            <div id="alert-announcer" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
            <video id="remote-video" autoplay playsinline class="hidden" aria-label="Remote video"></video>
            <video id="local-video" autoplay playsinline muted class="hidden" aria-label="Local camera preview"></video>
        </main>

        <aside id="details" aria-hidden="true">
            <div class="details-head">
                <h2 id="member-heading" class="pane-head">Member details</h2>
                <button id="details-close" class="icon-btn" title="Close details" aria-label="Close details">✕</button>
            </div>
            <div id="client-card"></div>
            <details class="inspector-section" open><summary>Server connection</summary><div id="news-area"></div></details>
            <details class="inspector-section"><summary>Your permissions</summary><p class="inspector-hint">Your resolved permissions on this server.</p><div id="perm-area"></div></details>
        </aside>
        </div>
        <footer id="voice-bar" aria-label="Voice controls">
            <div class="voice-buttons">
                <div class="voice-microphone"><button id="voice-mute" class="voice-control" aria-label="Mute microphone" aria-pressed="false"></button><div id="mic-meter" class="hidden" role="meter" aria-label="Microphone input level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="mic-fill cool"></div></div><span id="mic-warning" class="hidden" role="status" aria-live="polite"></span></div>
                <button id="ptt-btn" class="voice-control" title="Hold to talk" aria-label="Push to talk" aria-pressed="false"></button>
                <button id="voice-deafen" class="voice-control" aria-label="Deafen" aria-pressed="false"></button>
                <button id="voice-video" class="voice-control" title="Camera" aria-label="Camera" aria-pressed="false"></button>
                <button id="voice-screen" class="voice-control" title="Start sharing" aria-label="Start sharing" aria-pressed="false"></button>
                <details id="voice-options"><summary class="voice-control" aria-label="Voice options">Voice options</summary><div class="voice-options-menu">
                    <dl class="voice-devices"><dt id="voice-input-label">Microphone</dt><dd id="voice-input-device"></dd><dt id="voice-output-label">Audio output</dt><dd id="voice-output-device"></dd></dl>
                    <button id="voice-settings" class="voice-control" type="button"></button>
                    <button id="voice-prio" class="voice-control" title="Priority speaker" aria-label="Priority speaker" aria-pressed="false">Priority speaker</button>
                    <button id="voice-lowbw" class="voice-control" title="Low-bandwidth mode" aria-label="Low-bandwidth mode" aria-pressed="false">Low bandwidth</button>
                    <span id="hotkey-status" role="status" aria-live="polite"></span>
                </div></details>
                <span class="voice-disconnect-group"><button id="voice-leave-channel" class="voice-control" type="button"></button><button id="voice-disconnect" class="voice-control" type="button"></button></span>
            </div>
            <div class="voice-info"><div class="voice-summary"><div id="voice-status" role="status" aria-live="polite">Voice disconnected</div><button id="voice-latency" type="button" aria-haspopup="dialog" hidden></button></div><span id="voice-context"></span><span id="conn-pill" class="pill">offline</span></div>
            <div id="mic-status" class="warn" role="status" aria-live="polite"></div>
        </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
