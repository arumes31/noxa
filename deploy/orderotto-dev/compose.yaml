name: noxa

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: noxa
      POSTGRES_USER: noxa
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - /container/noxa/postgres:/var/lib/postgresql/data
      - /container/noxa/secrets/postgres-password:/run/secrets/postgres-password:ro
      - /container/noxa/secrets/postgres-tls:/run/postgres-tls:ro
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/postgres-tls/server.crt, -c, ssl_key_file=/run/postgres-tls/server.key, -c, shared_buffers=128MB, -c, max_connections=100]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U noxa -d noxa]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  server:
    image: noxa:roles-v1
    build:
      context: /container/noxa/source
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    working_dir: /app
    environment:
      NOXA_DATABASE_URL_FILE: /run/secrets/database-url
      NOXA_DEV_MODE: "false"
      GOMEMLIMIT: 700MiB
      GOMAXPROCS: "2"
    volumes:
      - /container/noxa/data:/data
      - /container/noxa/config/config.yaml:/app/config.yaml:ro
      - /container/noxa/secrets/database-url:/run/secrets/database-url:ro
      - /container/noxa/secrets/postgres-tls/server.crt:/run/secrets/postgres-ca.crt:ro
    ports:
      - "12333:12333/tcp"
      - "12334:12334/udp"
      - "12336:12336/tcp"
      - "12341:12341/udp"
      - "127.0.0.1:12335:12335/tcp"
      - "127.0.0.1:12337:12337/tcp"
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 40s
    logging: *logging

  backup:
    image: noxa-backup:roles-v1
    build:
      context: /container/noxa/source
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: noxa
      PGDATABASE: noxa
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres-ca.crt
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - /container/noxa/backups:/backups
      - /container/noxa/secrets/postgres-password:/run/secrets/postgres-password:ro
      - /container/noxa/secrets/postgres-tls/server.crt:/run/secrets/postgres-ca.crt:ro
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
